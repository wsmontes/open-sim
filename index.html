<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Sim</title>
<link rel="stylesheet" href="/src/browser/style.css">
</head>
<body>
<main id="app">
<canvas id="game" width="600" height="400" aria-label="Cidade isométrica"></canvas>
<section id="hud" aria-label="Painéis do jogo">

<section class="panel" id="panel-stats" data-panel="stats" aria-label="Estatísticas da cidade">
<header class="panel-head" data-drag-handle>
<h2 class="panel-title">Cidade</h2>
<button class="panel-collapse" type="button" data-collapse aria-expanded="true" aria-label="Minimizar painel Cidade" title="Minimizar painel">&#9662;</button>
</header>
<div class="panel-body" data-panel-body>
<dl id="hud-stats">
<div><dt>Dinheiro</dt><dd id="hud-money">0</dd></div>
<div><dt>População</dt><dd id="hud-population">0</dd></div>
<div><dt>Energia</dt><dd id="hud-energy">0/0</dd></div>
<div><dt>Felicidade</dt><dd id="hud-happiness">0%</dd></div>
</dl>
<div id="hud-speed" role="group" aria-label="Velocidade da partida">
<button type="button" data-speed="0" aria-label="Pausar" title="Pausar">&#10074;&#10074;</button>
<button type="button" data-speed="1" aria-label="Velocidade 1×" title="Velocidade 1×">1×</button>
<button type="button" data-speed="2" aria-label="Velocidade 2×" title="Velocidade 2×">2×</button>
</div>
</div>
</section>

<section class="panel" id="panel-tools" data-panel="tools" aria-label="Ferramentas de construção">
<header class="panel-head" data-drag-handle>
<h2 class="panel-title">Ferramentas</h2>
<button class="panel-collapse" type="button" data-collapse aria-expanded="true" aria-label="Minimizar painel Ferramentas" title="Minimizar painel">&#9662;</button>
</header>
<nav class="panel-body" id="hud-tools" data-panel-body aria-label="Ferramentas">
<button type="button" data-tool="explore" title="Explorar a cidade"><span class="tool-name">Explorar</span></button>
<button type="button" data-tool="road" title="Construir rua"><span class="tool-name">Rua</span><span class="tool-cost"></span></button>
<button type="button" data-tool="residential" title="Zoneamento residencial"><span class="tool-name">Residencial</span><span class="tool-cost"></span></button>
<button type="button" data-tool="commercial" title="Zoneamento comercial"><span class="tool-name">Comércio</span><span class="tool-cost"></span></button>
<button type="button" data-tool="industrial" title="Zoneamento industrial"><span class="tool-name">Indústria</span><span class="tool-cost"></span></button>
<button type="button" data-tool="power" title="Usina de energia"><span class="tool-name">Energia</span><span class="tool-cost"></span></button>
<button type="button" data-tool="park" title="Parque"><span class="tool-name">Parque</span><span class="tool-cost"></span></button>
<button type="button" data-tool="demolish" title="Demolir construção"><span class="tool-name">Demolir</span><span class="tool-cost"></span></button>
</nav>
</section>

<section class="panel" id="panel-places" data-panel="places" aria-label="Lugares e coordenadas">
<header class="panel-head" data-drag-handle>
<h2 class="panel-title">Lugares</h2>
<button class="panel-collapse" type="button" data-collapse aria-expanded="true" aria-label="Minimizar painel Lugares" title="Minimizar painel">&#9662;</button>
</header>
<div class="panel-body" data-panel-body>
<p id="hud-now">Agora em <strong id="hud-place">—</strong></p>
<dl id="city-facts" hidden>
<div><dt>População real</dt><dd id="city-population">—</dd></div>
<div><dt>País</dt><dd id="city-country">—</dd></div>
<div><dt>Área</dt><dd id="city-area">—</dd></div>
</dl>
<p id="city-scale" hidden></p>
<p id="city-source" class="panel-hint"></p>
<div id="hud-places" role="group" aria-label="Lugares">
<button type="button" data-place="Vancouver">Vancouver</button>
<button type="button" data-place="São Paulo">São Paulo</button>
<button type="button" data-place="Lisboa">Lisboa</button>
</div>
<form id="place-form">
<label for="place-lat">Latitude</label>
<input id="place-lat" name="lat" inputmode="decimal" size="9" placeholder="-23.5505" autocomplete="off">
<label for="place-lon">Longitude</label>
<input id="place-lon" name="lon" inputmode="decimal" size="9" placeholder="-46.6333" autocomplete="off">
<button type="submit">Ir</button>
</form>
<p id="place-error" role="alert" hidden></p>
</div>
</section>

<section class="panel" id="panel-nav" data-panel="nav" aria-label="Navegação do mapa">
<header class="panel-head" data-drag-handle>
<h2 class="panel-title">Mapa</h2>
<button class="panel-collapse" type="button" data-collapse aria-expanded="true" aria-label="Minimizar painel Mapa" title="Minimizar painel">&#9662;</button>
</header>
<div class="panel-body" data-panel-body>
<div id="hud-nav" role="group" aria-label="Zoom e orientação">
<button id="hud-zoom-out" type="button" data-zoom="-1" aria-label="Reduzir zoom" title="Reduzir zoom">&#8722;</button>
<button id="hud-zoom-in" type="button" data-zoom="1" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
<button id="hud-north" type="button" aria-label="Voltar ao norte" title="Voltar ao norte">
<span class="compass" aria-hidden="true"><span id="hud-compass-needle" class="compass-needle">&#9650;</span></span>
</button>
</div>
<button id="hud-overview" type="button" title="Ver a cidade inteira e os arredores" aria-label="Visão geral">Visão geral</button>
</div>
</section>

<section class="panel" id="panel-status" data-panel="status" aria-label="Situação do jogo">
<header class="panel-head" data-drag-handle>
<h2 class="panel-title">Situação</h2>
<button class="panel-collapse" type="button" data-collapse aria-expanded="true" aria-label="Minimizar painel Situação" title="Minimizar painel">&#9662;</button>
</header>
<div class="panel-body" id="hud-bottom" data-panel-body>
<span id="cost-preview"></span>
<span id="command-notice" role="status" hidden></span>
<span id="map-message" role="status" hidden></span>
<button id="map-retry" type="button" hidden>Tentar novamente</button>
<span id="tile-cache" class="panel-hint" role="status" title="Mapa guardado neste dispositivo"></span>
<span id="save-status" role="status"></span>
<button id="save-overwrite" type="button" hidden>Sobrescrever save incompatível</button>
<a id="hud-attribution" class="panel-attribution" target="_blank" rel="noopener" href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>
</div>
</section>

</section>
</main>
<script type="module" src="/src/browser/main.ts"></script>
</body>
</html>
