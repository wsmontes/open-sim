name: browser performance smoke

on:
  push:
    branches:
      - codex/open-sim-design
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/open-sim-preview.log 2>&1 &
          echo $! > /tmp/open-sim-preview.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/open-sim-preview.log
          exit 1
      - name: Measure cold and warm startup
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tools/browser-perf.mjs http://127.0.0.1:4173/
      - name: Preview log
        if: always()
        run: cat /tmp/open-sim-preview.log || true
