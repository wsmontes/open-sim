<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência de movimento TransLink</title><style>body{margin:0;font:14px system-ui;background:#f2efe5;color:#254346}header{padding:16px;display:flex;gap:20px;align-items:center}button,select{font:inherit;padding:8px}canvas{display:block;width:100%;height:520px;background:#e6e6d4}footer,pre{padding:12px;margin:0}pre{font-size:11px;white-space:pre-wrap}footer{font-size:11px}</style><header><strong>Movimento simulado · percursos oficiais conectados</strong><select aria-label="Percurso"></select><button id="pause">Pausar</button><select aria-label="Velocidade"><option value="1">1×</option><option value="3">3×</option></select></header><canvas aria-label="Ônibus percorrendo a rede auditada"></canvas><pre aria-label="Posições e estado do movimento"></pre><footer></footer><script type="module">
import {createMobilityEngine} from '/src/presentation/mobility-engine.ts';
import {routeBuses} from '/src/presentation/transit-motion.ts';
import {drawMobilityAgent} from '/src/surfaces/canvas/mobility-draw.ts';
import {motionSeconds} from '/src/presentation/clock.ts';
const data=await (await fetch('./transit-motion-network.json')).json(),nodes=new Map(data.nodes.map(n=>[n.id,n])),edges=new Map(data.edges.map(e=>[e.id,e])),outgoing=new Map();
for(const edge of edges.values()){const ids=outgoing.get(edge.from)||[];ids.push(edge.id);outgoing.set(edge.from,ids);}
const network={revision:data.revision,nodes,edges,outgoing},canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('select'),speedControl=document.querySelector('select[aria-label="Velocidade"]'),pause=document.querySelector('#pause'),status=document.querySelector('pre');let engine,pattern,speed=1,motion=0,last=performance.now(),lastStatus=0;
for(const [i,p] of data.patterns.entries()){const option=document.createElement('option');option.value=i;option.textContent=`${p.routeId==='30055'?'023 · Pacific':'019 · Kingsway'} · sentido ${p.directionId}`;select.append(option);}
const change=()=>{pattern=data.patterns[Number(select.value)];engine=createMobilityEngine(network,13);engine.setAgents(routeBuses([pattern],13));motion=0;};change();select.onchange=change;
pause.onclick=()=>{speed=speed?0:Number(speedControl.value);pause.textContent=speed?'Pausar':'Continuar';};speedControl.onchange=()=>{speed=Number(speedControl.value);pause.textContent='Pausar';};document.querySelector('footer').textContent=data.attribution;
function draw(now){const seconds=Math.min(.25,(now-last)/1000);last=now;const elapsed=motionSeconds(seconds,speed);motion+=elapsed;engine.advance(elapsed);const agents=engine.frame(),width=canvas.clientWidth,height=canvas.clientHeight;if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}ctx.clearRect(0,0,width,height);
 const points=pattern.edges.flatMap(id=>edges.get(id).path),minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),minY=Math.min(...points.map(p=>p.y)),maxY=Math.max(...points.map(p=>p.y)),scale=Math.min((width-80)/(maxX-minX||1),(height-60)/(maxY-minY||1)),project=p=>({x:40+(p.x-minX)*scale,y:30+(p.y-minY)*scale});
 ctx.beginPath();for(const [i,p] of points.entries()){const screen=project(p);i?ctx.lineTo(screen.x,screen.y):ctx.moveTo(screen.x,screen.y);}ctx.strokeStyle='#899487';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#ece4ad';ctx.lineWidth=1;ctx.stroke();
 let distance=0;for(const id of pattern.edges){const edge=edges.get(id);for(const stop of pattern.stopDistancesM)if(stop>=distance&&stop<=distance+edge.lengthM){const a=edge.path[0],b=edge.path.at(-1),t=(stop-distance)/edge.lengthM,p=project({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});ctx.fillStyle='#d68447';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}distance+=edge.lengthM;}
 for(const agent of agents)drawMobilityAgent(ctx,agent,project,.8,motion);
 if(now-lastStatus>500){lastStatus=now;status.textContent=JSON.stringify({speed,agents:agents.map(a=>({id:a.id.slice(-1),point:a.point,heading:a.heading})),simulatedSeconds:Math.round(motion*100)/100});}requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></html>
