<!doctype html><meta charset="utf-8"><title>Verificação de escolas e sinais</title><style>body{margin:24px;font:16px system-ui;background:#edf0e8;color:#263f40}canvas{display:block;max-width:100%;border:1px solid #9ba9a0;margin-top:16px}button,select{padding:10px;margin-right:8px}pre{font-size:12px;white-space:pre-wrap}a{color:#315d77}</style>
<h1>Escolas reais · trajetos e sinais simulados</h1><p id="source"></p><select id="school" aria-label="Escola"></select><button id="pause">Pausar</button><select id="speed" aria-label="Velocidade"><option value="1">1×</option><option value="3">3×</option></select><button id="night">Noite</button><canvas width="1100" height="580"></canvas><pre id="status"></pre><p><a href="https://www.vsb.bc.ca/school-directory-and-map">Diretório VSB</a> · <a href="https://opendata.vancouver.ca/explore/dataset/traffic-signals/">Posições municipais dos sinais</a> · © OpenStreetMap contributors. Horário do cenário: segunda, 05/10/2026, 08:00 Vancouver. Paradas escolares: 20 s simulados; patrulha sem emergência.</p>
<script type="module">
import {createMobilityEngine} from '/src/presentation/mobility-engine.ts';
import {drawMobilityAgent,drawTrafficSignal} from '/src/surfaces/canvas/mobility-draw.ts';
import {motionSeconds} from '/src/presentation/clock.ts';
const data=await(await fetch('./civic-motion-network.json')).json(),nodes=new Map(data.nodes.map(n=>[n.id,n])),edges=new Map(data.edges.map(e=>[e.id,e])),outgoing=new Map();for(const e of edges.values()){const list=outgoing.get(e.from)??[];list.push(e.id);outgoing.set(e.from,list);}
const sites=await(await fetch('/src/adapters/reality/data/vancouver-signals.json')).json();
const network={revision:data.revision,nodes,edges,outgoing},canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),select=document.querySelector('#school');let engine,speed=1,paused=false,night=false,seconds=0,last=performance.now(),chosen;
for(const bus of data.buses){const option=document.createElement('option');option.value=bus.id;option.textContent=bus.schoolName;select.append(option);}
function reset(){engine=createMobilityEngine(network,1);engine.setSignalSites(sites);chosen=data.buses.find(b=>b.id===select.value);if(!chosen)return;const length=chosen.route.reduce((s,id)=>s+edges.get(id).lengthM,0);let distance=Math.max(0,length-120),index=0;while(index<chosen.route.length-1&&distance>=edges.get(chosen.route[index]).lengthM){distance-=edges.get(chosen.route[index]).lengthM;index++;}engine.setAgents([{...chosen,edgeIndex:index,distanceM:distance},...data.patrols]);seconds=0;document.querySelector('#source').textContent=chosen.schoolName+' · localização publicada pelo VSB · fonte capturada em 03/10/2026 · percurso público simulado';}
select.onchange=reset;reset();document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Continuar':'Pausar';};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);document.querySelector('#night').onclick=()=>{night=!night;};
function frame(now){const dt=motionSeconds((now-last)/1000,paused?0:speed);last=now;engine.advance(dt);seconds+=dt;ctx.fillStyle=night?'#22393d':'#e3e8dd';ctx.fillRect(0,0,1100,580);const route=chosen.route.map(id=>edges.get(id)),points=route.flatMap(e=>e.path),minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),minY=Math.min(...points.map(p=>p.y)),maxY=Math.max(...points.map(p=>p.y)),scale=Math.min(980/(maxX-minX||1),440/(maxY-minY||1)),project=p=>({x:60+(p.x-minX)*scale,y:50+(p.y-minY)*scale});ctx.strokeStyle=night?'#4e6365':'#b0bdb0';ctx.lineWidth=9;for(const e of edges.values()){ctx.beginPath();e.path.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});ctx.stroke();}ctx.strokeStyle='#9c8237';ctx.lineWidth=3;for(const e of route){ctx.beginPath();e.path.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});ctx.stroke();}for(const s of engine.signals()){const p=project(s.point);if(p.x>0&&p.y>0&&p.x<1100&&p.y<580)drawTrafficSignal(ctx,s,{x:p.x-s.direction.x*12-s.direction.y*9,y:p.y-s.direction.y*12+s.direction.x*9},.8);}for(const a of engine.frame())drawMobilityAgent(ctx,a,project,scale/6.23,seconds);const target=project(route.at(-1).path.at(-1));ctx.fillStyle=night?'#efdc9e':'#3c5755';ctx.font='bold 15px system-ui';ctx.fillText(chosen.schoolName,target.x+8,target.y-20);ctx.fillText('Escolar',20,545);drawMobilityAgent(ctx,{id:'legend-school',kind:'school-bus',point:{x:120,y:540},heading:{x:1,y:0},seed:1,method:'simulated',elevationM:null},p=>p,2,seconds);ctx.fillText('Viatura',220,545);drawMobilityAgent(ctx,{id:'legend-police',kind:'police',point:{x:310,y:540},heading:{x:1,y:0},seed:1,method:'simulated',elevationM:null},p=>p,2,seconds);ctx.fillText('Ônibus urbano',420,545);drawMobilityAgent(ctx,{id:'legend-bus',kind:'bus',point:{x:560,y:540},heading:{x:1,y:0},seed:1,method:'simulated',elevationM:null},p=>p,2,seconds);status.textContent=JSON.stringify({paused,speed,seconds:Math.round(seconds*100)/100,agents:engine.frame().map(a=>({id:a.id,kind:a.kind,school:a.schoolName,point:a.point})),signals:engine.signals().length,reportedPositionMatches:engine.signals().filter(s=>s.reportedSignalId).length},null,2);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
